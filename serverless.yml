service: monpetitbiz

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-west-1
  memorySize: 1024
  timeout: 29
  httpApi:
    payload: '2.0'
  environment:
    NODE_OPTIONS: --enable-source-maps

package:
  patterns:
    - '!**/*.map'
    - 'dist/**'
    - 'node_modules/**'

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi:
          method: ANY
          path: /{proxy+}


